# gitleaks configuration for this repository (gitleaks 8.30.1). Copy to the
# repository root as .gitleaks.toml and name it in gate.config.psd1 under Gitleaks.
#
# The default rules apply unchanged. gitleaks scans a directory without reading
# .gitignore, so folders that are generated and never committed are listed below.
#
# A false positive in a file that is committed goes in .gitleaksignore by fingerprint,
# with a comment giving the reason. It never goes in a path entry here.

[extend]
useDefault = true

[allowlist]
description = "Generated output: never committed"
paths = [
    '''(^|[\\/])Output[\\/]''',
    '''(^|[\\/])TestResults[\\/]''',
]
